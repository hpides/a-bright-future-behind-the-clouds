  # --- DuckDB target (behind the "duckdb" profile) -------------------------
services:
  duckdb-tpch:
    image: duckdb/duckdb:latest
    container_name: duckdb-tpch
    profiles: ["duckdb"]
    cpuset: "${CPU_SET_DB}"
    environment:
      TPCH_SCALE_FACTOR: ${TPCH_SCALE_FACTOR:-1}
    volumes:
    - ./:/scripts/:ro,z
    - ./results/duckdb:/results
    command: ["duckdb", "-f", "/scripts/run_tpch.sql"]
    deploy:
      resources:
        limits:
          memory: "${MEMORY_LIMIT_DB}"
          
  duckdb-tpch-prebuilt:
    build:
      context: ./duckdb-prebuilt
      args:
        TPCH_SF: ${TPCH_SF:-1}
    container_name: duckdb-tpch-prebuilt
    profiles: ["duckdb-prebuilt"]
    cpuset: "${CPU_SET_DB}"
    volumes:
      - ./results/duckdb-prebuilt:/results
    command: ["duckdb", "/data/tpch-sf${TPCH_SF:-1}.db", "-f", "/scripts/run_tpch_prebuilt.sql"]


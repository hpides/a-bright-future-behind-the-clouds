# postgresql.conf tuning — TPC-C durable mode, SF=10, Postgres on 2 cores
# include = 'tuning.conf'

# Connections
max_connections = 100
superuser_reserved_connections = 3

# Memory (SF=10 ~1-2GB dataset, fits easily)
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 1GB
autovacuum_work_mem = 256MB

# CPU (2 cores for Postgres; disable parallelism, favor concurrent backends)
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
jit = off

# WAL / durability — full ACID, no shortcuts
wal_level = minimal
max_wal_senders = 0
synchronous_commit = on
full_page_writes = on
fsync = on
wal_compression = on              # offsets full_page_writes cost, no durability impact
wal_buffers = 32MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Group commit — batches fsyncs across concurrent commits, still fully durable
commit_delay = 1000
commit_siblings = 5

# Planner (NVMe assumption; use random_page_cost 2-4, eic=1 on microSD)
random_page_cost = 1.1
effective_io_concurrency = 200

# Autovacuum (aggressive; capped workers to not compete with 2 PG cores)
autovacuum_max_workers = 2
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 2000

# Diagnostics — confirms bottleneck is fsync/checkpoint, not CPU
track_io_timing = on
log_checkpoints = on

x-tpcc-tuning: &tpcc-tuning
  TPCC_WAREHOUSES: ${TPCC_WAREHOUSES:-10}
  TPCC_TERMINALS: ${TPCC_TERMINALS:-4}
  TPCC_DURATION_SEC: ${TPCC_DURATION_SEC:-60}
  BENCHBASE_CREATE: ${BENCHBASE_CREATE:-true}
  BENCHBASE_LOAD: ${BENCHBASE_LOAD:-true}
  BENCHBASE_EXECUTE: ${BENCHBASE_EXECUTE:-true}

x-pg-healthcheck: &pg-healthcheck
  test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-benchbase} || exit 1"]
  interval: 5s
  timeout: 5s
  retries: 20

services:

  # --- CedarDB target (behind the "cedardb" profile) ---------------------

  cedardb:
    image: cedardb/cedardb
    container_name: cedardb
    profiles: ["cedardb"]
    environment:
      CEDAR_USER: ${DB_USER:-admin}
      CEDAR_PASSWORD: ${DB_PASSWORD:-password}
      CEDAR_DB: ${DB_NAME:-benchbase}
    ports:
      - "${CEDARDB_HOST_PORT:-5432}:5432"
    volumes:
      - cedardb-data:/var/lib/cedardb/data
    healthcheck: *pg-healthcheck

  benchbase-cedardb:
    build: .
    container_name: benchbase-tpcc-cedardb
    profiles: ["cedardb"]
    depends_on:
      cedardb:
        condition: service_healthy
    environment:
      <<: *tpcc-tuning
      DB_ENGINE: cedardb
      DB_HOST: cedardb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-benchbase}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      # :z relabels the SELinux context on this bind mount so the container
      # can actually write to it on SELinux-enforcing hosts (Fedora/RHEL/
      # CentOS) — a no-op, harmless flag on non-SELinux systems.
      - ./results/cedardb:/benchbase/results:z

  # --- Postgres target (behind the "postgres" profile) --------------------
  # Independent of CedarDB — its own container, port, and volume — so you
  # can bring up either engine on its own, or both side by side to compare.

  postgres:
    image: postgres:18.4-trixie
    container_name: postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-benchbase}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18 moved its default data directory/volume under
      # /var/lib/postgresql (versioned subdir), not /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
      # Custom tuning (postgres/tuning.conf) is layered on top of the
      # container's own generated postgresql.conf via include_if_exists,
      # injected by init-custom-config.sh on first initialization — see
      # that script's comments for why we don't just replace the config
      # file outright. Both paths must exist as real files on the host
      # before the first run, same caveat as duckdb/run_tpch.sql elsewhere
      # in this repo (see README's Notes section).
      - ./tuning/tuning.conf:/etc/postgresql-custom/tuning.conf:ro,z
      - ./tuning/init-custom-config.sh:/docker-entrypoint-initdb.d/init-custom-config.sh:ro,z
    healthcheck: *pg-healthcheck

  benchbase-postgres:
    build: .
    container_name: benchbase-tpcc-postgres
    profiles: ["postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *tpcc-tuning
      DB_ENGINE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-benchbase}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ./results/postgres:/benchbase/results:z


volumes:
  cedardb-data:
  postgres-data:
  tpch-official-data:

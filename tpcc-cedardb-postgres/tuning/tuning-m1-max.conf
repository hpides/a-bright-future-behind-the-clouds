# postgresql-tuning.conf
# TPC-C (BenchBase) — Apple M1 Max, 8 cores (6P+2E), 32GB unified memory
# SF=50, durability-focused, macOS/Darwin specifics applied

# ---- Connections ----
max_connections = 100
superuser_reserved_connections = 3

# ---- Memory ----
shared_buffers = 8GB
effective_cache_size = 20GB
work_mem = 32MB
maintenance_work_mem = 1GB
huge_pages = off               # macOS does not support Linux-style huge pages — must be off, "try" will just silently no-op

# ---- CPU ----
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 2

# ---- Durability — CRITICAL macOS DIFFERENCE ----
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = on
wal_sync_method = fdatasync    # default/best on Linux; fsync_writethrough is Darwin-only and
                                # invalid here. On ext4/xfs this calls fdatasync() correctly.

# ---- WAL / Checkpoints ----
wal_level = replica
wal_buffers = 64MB
min_wal_size = 4GB
max_wal_size = 16GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# ---- Storage / Planner (Apple NVMe SSD) ----
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 0   # posix_fadvise is not implemented on Darwin — this setting is a
                                # no-op on macOS regardless of value; leave at 0 rather than
                                # implying prefetch behavior that isn't happening
default_statistics_target = 100

# ---- Autovacuum ----
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 10s
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ---- Logging ----
log_checkpoints = on
log_autovacuum_min_duration = 250ms
log_lock_waits = on
track_io_timing = on

# postgresql tuning.conf — TPC-C, SF=250 warehouses, terminals 1..64
# Host: 128 cores (64 pinned to PG, 64 to BenchBase), 64GB RAM total
# Priority: durability (no fsync/synchronous_commit shortcuts)

# --- Connections ---
max_connections = 200                  # covers 64 terminals + pool headroom
superuser_reserved_connections = 5

# --- Memory (PG shares 64GB box with BenchBase JVM; keep headroom) ---
shared_buffers = 16GB                  # ~25% of RAM; SF250 dataset ~25-40GB, rest via OS cache
effective_cache_size = 40GB            # shared_buffers + expected OS page cache
work_mem = 32MB                        # simple OLTP joins/sorts; watch total = work_mem * conns
maintenance_work_mem = 1GB
huge_pages = try

# --- Durability (non-negotiable) ---
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
wal_compression = on
wal_log_hints = off

# --- WAL / Checkpoints (absorb TPC-C's heavy write churn) ---
wal_buffers = 64MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 32GB
min_wal_size = 8GB
checkpoint_flush_after = 1MB
bgwriter_delay = 10ms
bgwriter_lru_maxpages = 500

# --- Storage/IO (assume NVMe/SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200
track_io_timing = on

# --- CPU (PG gets 64 of 128 cores — pin via cgroups/taskset outside PG) ---
max_worker_processes = 64
max_parallel_workers = 16              # TPC-C txns are short/point-lookup; parallelism rarely helps
max_parallel_workers_per_gather = 0    # disable parallel plans to cut planning/latency overhead
max_parallel_maintenance_workers = 4

# --- Autovacuum (aggressive — TPC-C is update/insert heavy on hot rows) ---
autovacuum = on
autovacuum_max_workers = 8
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = 2ms

# --- Logging (minimal overhead, keep checkpoint/lock visibility for tuning) ---
log_checkpoints = on
log_autovacuum_min_duration = 250ms
log_lock_waits = on
log_min_duration_statement = 1000ms

# --- Planner stats ---
default_statistics_target = 100

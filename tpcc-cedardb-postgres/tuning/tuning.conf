# TPC-C-tuned configuration for a 32GB RAM / 12 thread host.
#
# This is a rewrite from a generic "web app" sizing profile, not just a
# resize — TPC-C is a heavy, highly-concurrent, small-transaction OLTP
# write workload with specific patterns (hot-row contention on warehouse/
# district, SERIALIZABLE isolation per Benchbase's postgres profile, tiny
# point-lookup queries) that a generic profile doesn't account for. See
# the comments on each group below for the TPC-C-specific reasoning.
#
# If you change TPCC_TERMINALS in benchbase.env away from 12, revisit
# max_connections below to match (terminals + headroom, not just terminals).
#
# DB Version: 18
# OS Type: linux
# DB Type: tpcc (OLTP, write-heavy, small transactions)
# Total Memory (RAM): 32 GB
# CPU threads: 12
# Data Storage: ssd

# --- Connections -----------------------------------------------------------
# Not just 12 (matching TPCC_TERMINALS) — Benchbase's load phase uses more
# concurrent connections than the terminal count, plus headroom for psql
# checks/monitoring on top of the actual benchmark terminals.
max_connections = 40

# --- Memory ------------------------------------------------------------------
# shared_buffers: the standard 25%-of-RAM baseline for OLTP. Going much
# higher risks double-buffering with the OS page cache for little gain.
shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 32MB
maintenance_work_mem = 2GB

# --- Checkpoint / WAL --------------------------------------------------------
# TPC-C is write-dominated (that's the whole point of the benchmark), so
# this matters more here than for a typical read-heavy web app profile.
checkpoint_completion_target = 0.9
# Roughly doubled vs. a generic profile: fewer, larger checkpoints under
# sustained heavy write load, at the cost of more disk space for WAL.
min_wal_size = 2GB
max_wal_size = 8GB
wal_buffers = 64MB
wal_compression = lz4

# --- I/O ---------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
huge_pages = try
io_method = worker

# --- Query execution -----------------------------------------------------
max_worker_processes = 6
max_parallel_workers = 6
max_parallel_workers_per_gather = 0
# Kept modest but nonzero — still useful for the load phase's index builds.
max_parallel_maintenance_workers = 2

jit = off

# --- Autovacuum --------------------------------------------------------------
# The single biggest TPC-C-specific change. warehouse/district have very
# few rows (1 per warehouse) but get updated on *every* transaction
# (running YTD balance, next order ID). The default scale-factor-based
# threshold is a percentage of table size — on a table with 10 rows,
# that's essentially "never," so these specific tables bloat badly over a
# long run even though autovacuum looks like it's running fine overall.
# Lowering the global scale factor (rather than just tuning per-table,
# which needs ALTER TABLE against the actual schema, a bigger change than
# this config file) catches this across the board.
autovacuum_max_workers = 4
autovacuum_work_mem = 1GB
autovacuum_vacuum_scale_factor = 0.05
autovacuum_vacuum_threshold = 25
# Catch bloat faster under continuous write pressure (default 1min).
autovacuum_naptime = 10s
# Let autovacuum actually keep up rather than being throttled (default 200).
autovacuum_vacuum_cost_limit = 2000

# --- Isolation / locking ------------------------------------------------
# Benchbase runs the postgres profile at TRANSACTION_SERIALIZABLE, which
# uses predicate locking (SSI). The default max_pred_locks_per_transaction
# (64) can get exhausted under real TPC-C concurrency, causing spurious
# serialization failures that look like "the benchmark losing" but are
# really just an undersized lock table, not genuine contention.
max_pred_locks_per_transaction = 256

# Left on deliberately: durable commit is part of what TPC-C is measuring.
# Turning this off would inflate throughput numbers without actually
# reflecting the workload the benchmark is meant to represent.
synchronous_commit = on

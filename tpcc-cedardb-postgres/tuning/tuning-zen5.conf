# =====================================================================
# postgresql tuning.conf — TPC-C style OLTP workload
# Target host: 128 hardware threads, 256 GB RAM, NVMe/SSD storage
# Assumes PostgreSQL 15/16. Values are starting points — validate
# against your actual pgbench/TPC-C run and adjust from there.
# =====================================================================

# ---------------------------------------------------------------------
# MEMORY
# ---------------------------------------------------------------------
# 25% of RAM is the standard OLTP starting point. TPC-C's working set
# (warehouse/district/customer/stock tables) benefits from a large
# buffer cache, but going much past ~25-30% starts fighting the OS
# page cache and double-buffering WAL-heavy writes.
shared_buffers = 64GB

# Tells the planner how much memory is available for caching overall
# (shared_buffers + OS cache). Does not allocate memory itself.
effective_cache_size = 192GB

# TPC-C queries are short, index-driven, low-fanout. Keep work_mem
# modest — this is PER SORT/HASH NODE, PER CONNECTION, and with high
# concurrency (128 threads -> likely 200-400 active backends via a
# pooler) a large value here risks OOM under load spikes.
work_mem = 64MB

# Maintenance ops (VACUUM, CREATE INDEX, autovacuum workers) can use
# more per operation since they're not per-connection.
maintenance_work_mem = 2GB
autovacuum_work_mem = 1GB

# ---------------------------------------------------------------------
# CONNECTIONS / PARALLELISM
# ---------------------------------------------------------------------
# TPC-C is short-transaction OLTP — favor many lightweight backends
# over per-query parallelism. Strongly recommend fronting this with
# PgBouncer (transaction pooling) rather than raw max_connections.
max_connections = 400

# Parallel query workers add latency variance and rarely help TPC-C's
# point lookups / short scans. Disable per-query parallelism; keep
# workers available for maintenance (autovacuum, parallel index builds).
max_worker_processes = 128
max_parallel_workers = 32
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 4

# ---------------------------------------------------------------------
# WRITE-AHEAD LOG (TPC-C is write-heavy: NewOrder/Payment/Delivery)
# ---------------------------------------------------------------------
wal_level = replica
wal_buffers = 64MB
wal_compression = on

# Batch fsyncs — big win on TPC-C throughput. Set to 'off' ONLY if you
# accept possible loss of the last few transactions on crash (common
# in pure throughput benchmarking, NOT recommended for production
# durability requirements).
synchronous_commit = on
#synchronous_commit = off   # uncomment for max tpmC at reduced durability

# Fewer, larger checkpoints = less write amplification. With 256GB RAM
# and NVMe, size WAL generously so checkpoints are time- not
# volume-triggered.
min_wal_size = 8GB
max_wal_size = 32GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Reduce commit fsync overhead for concurrent commits (huge win at
# 128 threads worth of concurrent transactions).
commit_delay = 10
commit_siblings = 10

# ---------------------------------------------------------------------
# BACKGROUND WRITER
# ---------------------------------------------------------------------
bgwriter_delay = 100ms
bgwriter_lru_maxpages = 500
bgwriter_lru_multiplier = 4.0

# ---------------------------------------------------------------------
# STORAGE / PLANNER COST MODEL (assumes NVMe/SSD)
# ---------------------------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# ---------------------------------------------------------------------
# ASYNC I/O (new in PG18)
# ---------------------------------------------------------------------
# io_uring needs (a) the server built with --with-liburing, (b) a
# Linux kernel that supports it, and (c) the process actually being
# permitted to call io_uring_setup — containers with default seccomp
# profiles and distros that set kernel.io_uring_disabled=1/2 will
# block it with FATAL: could not setup io_uring queue: Operation not
# permitted. Postgres does NOT auto-fallback on that error, it's a
# hard startup failure. Defaulting to 'worker' here since it needs no
# special host permissions; switch to io_uring below once you've
# confirmed the host allows it (see notes above the FATAL you hit).
io_method = worker
#io_method = io_uring       # opt in once seccomp/sysctl/memlock are cleared

# Size roughly to concurrent backends doing I/O, not total threads —
# 16-32 is plenty even at 128 threads.
io_workers = 16

# Max in-flight async I/Os per backend. -1 (default) lets Postgres
# pick based on effective_io_concurrency; leave as-is unless you have
# a specific reason to cap it.
io_max_concurrency = -1

# Merges adjacent block reads into bigger I/Os. Default (128kB) is
# fine for TPC-C's mostly-random, small-fanout access pattern — raise
# this only if you also run large sequential scans/reports on the
# same instance.
io_combine_limit = 128kB

# ---------------------------------------------------------------------
# AUTOVACUUM (TPC-C's stock/order-line/customer tables churn hard —
# under-tuned autovacuum is the #1 cause of TPC-C throughput collapse
# over long runs due to bloat)
# ---------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 8
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 2000

# New in PG18: caps how long autovacuum waits on huge tables even when
# scale_factor alone would push the threshold very high. TPC-C's
# stock/order_line tables grow large under sustained load — this keeps
# vacuum from falling arbitrarily far behind on them.
autovacuum_vacuum_max_threshold = 100000

# ---------------------------------------------------------------------
# LOCKS (TPC-C touches many rows/tables per transaction, foreign keys
# on order/order-line/stock create heavy lock table pressure)
# ---------------------------------------------------------------------
max_locks_per_transaction = 256
max_pred_locks_per_transaction = 256

# ---------------------------------------------------------------------
# HUGE PAGES (recommended at this shared_buffers size — configure OS
# huge pages before enabling; falls back to 'try' for safety)
# ---------------------------------------------------------------------
huge_pages = try

# ---------------------------------------------------------------------
# MONITORING (low overhead, worth keeping on while tuning)
# ---------------------------------------------------------------------
track_io_timing = on
track_functions = pl
log_checkpoints = on
log_autovacuum_min_duration = 250ms
log_lock_waits = on
log_temp_files = 0

# ---------------------------------------------------------------------
# MISC
# ---------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

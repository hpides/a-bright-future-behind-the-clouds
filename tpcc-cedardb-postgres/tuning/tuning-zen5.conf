# --- Memory (PG gets 128GB, benchbase gets other 128GB) ---
shared_buffers = 32GB
effective_cache_size = 96GB          # shared_buffers + expected OS page cache within PG's 128GB
work_mem = 16MB                      # small OLTP txns, high concurrency -> keep low
maintenance_work_mem = 2GB
huge_pages = try

# --- Durability (do not compromise) ---
fsync = on
synchronous_commit = on
full_page_writes = on
wal_sync_method = fdatasync

# --- WAL / checkpointing ---
wal_level = replica
wal_buffers = 128MB
wal_compression = zstd
min_wal_size = 8GB
max_wal_size = 24GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Connections ---
max_connections = 150

# --- Planner (assume NVMe) ---
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# --- Parallelism: TPC-C is short/simple OLTP, disable parallel query ---
max_worker_processes = 32
max_parallel_workers_per_gather = 0
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# --- Autovacuum: hammers stock/order-line/customer ---
autovacuum_max_workers = 6
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
autovacuum_vacuum_cost_limit = 3000
autovacuum_vacuum_cost_delay = 0

# --- Logging (off hot path) ---
logging_collector = off
log_min_duration_statement = -1
track_io_timing = off
